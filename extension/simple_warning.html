<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>🛡️ PhishGuard — Threat Blocked</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #b71c1c, #e53935);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      padding: 36px 32px;
      max-width: 520px;
      width: 100%;
      box-shadow: 0 12px 40px rgba(0,0,0,0.35);
      animation: slideUp 0.5s ease-out;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .shield {
      text-align: center;
      font-size: 56px;
      margin-bottom: 10px;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%   { transform: scale(1);    filter: drop-shadow(0 0 0px #e53935); }
      50%  { transform: scale(1.12); filter: drop-shadow(0 0 14px #e53935); }
      100% { transform: scale(1);    filter: drop-shadow(0 0 0px #e53935); }
    }

    .countdown {
      text-align: center;
      font-size: 13px;
      color: #c62828;
      font-weight: 600;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    h1 {
      text-align: center;
      font-size: 22px;
      color: #c62828;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    .info-block {
      background: #fff8f8;
      border-left: 4px solid #e53935;
      border-radius: 6px;
      padding: 12px 14px;
      margin-bottom: 12px;
      word-break: break-all;
    }

    .info-block .label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: #999;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .info-block .value {
      font-size: 14px;
      color: #222;
      font-weight: 500;
    }

    .risk-bar-wrap {
      background: #eee;
      border-radius: 8px;
      height: 10px;
      overflow: hidden;
      margin-top: 8px;
    }

    .risk-bar {
      height: 100%;
      border-radius: 8px;
      transition: width 0.8s ease;
      background: #e53935;
    }

    .risk-label {
      font-size: 12px;
      color: #e53935;
      font-weight: 700;
      margin-top: 4px;
      text-align: right;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 24px;
    }

    button {
      padding: 13px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    button:hover { opacity: 0.88; transform: scale(1.02); }

    .btn-back      { background: #c62828; color: #fff; }
    .btn-details   { background: #1565c0; color: #fff; }
    .btn-dashboard { background: #2e7d32; color: #fff; }
    .btn-trust     { background: #6a1b9a; color: #fff; }
    .btn-report    { background: #f9a825; color: #000; }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 18px;
    }

    @media (max-width: 480px) {
      .card { padding: 24px 18px; }
      h1 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="shield">🛡️</div>
    <h1>Phishing Site Detected</h1>
    <p class="subtitle">PhishGuard blocked this site to protect you.</p>
    <p class="countdown" id="countdown">Closing tab in 15 seconds...</p>

    <div class="info-block">
      <div class="label">Blocked URL</div>
      <div class="value" id="blockedUrl">Loading...</div>
      <button id="copyUrlBtn" style="margin-top:8px;padding:5px 12px;font-size:12px;border:none;border-radius:6px;background:#e0e0e0;color:#333;cursor:pointer;font-weight:600;">📋 Copy URL</button>
    </div>

    <div class="info-block">
      <div class="label">Reason</div>
      <div class="value" id="reasonText">Analyzing...</div>
    </div>

    <div class="info-block">
      <div class="label">Risk Score</div>
      <div class="risk-bar-wrap">
        <div class="risk-bar" id="riskBar" style="width:0%"></div>
      </div>
      <div class="risk-label" id="riskLabel">0%</div>
    </div>

    <div class="buttons">
      <button id="goBackBtn"    class="btn-back">⬅ Go Back to Safety</button>
      <button id="detailsBtn"   class="btn-details">🤖 View AI Analysis</button>
      <button id="dashboardBtn" class="btn-dashboard">📊 Open Dashboard</button>
      <button id="trustBtn"     class="btn-trust">✅ Trust This Site</button>
      <button id="reportBtn"    class="btn-report">🚨 Report This Site</button>
    </div>

    <p class="footer-note">Powered by PhishGuard AI · Stay safe online</p>
  </div>

  <script src="simple_warning.js" defer></script>
</body>
</html>
